services:
  postgres:
    image: postgres:17-alpine
    container_name: qaflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qaflow_dev
      POSTGRES_USER: qaflow_user
      POSTGRES_PASSWORD: qaflow_password
    ports:
      - "5432:5432"
    volumes:
      - qaflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaflow_user -d qaflow_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qaflow_postgres_data:
